<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scanner Kehadiran - Buku Tamu</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- html5-qrcode library -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

    <style>
        /* CSS Reset & Variables */
        :root {
            --primary: #8B5E3C; /* Warm brown */
            --accent: #C9A87C; /* Gold */
            --bg: #FDF8F4; /* Warm cream */
            --card-bg: #FFFFFF;
            --text-main: #3D2B1F;
            --success: #4CAF50;
            --error: #E53935;
            --warning: #FF9800;
            --gray: #9E9E9E;
            --light-gray: #F5F5F5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        h1, h2, h3, h4 {
            font-family: 'Playfair Display', serif;
        }

        /* Container to avoid Blogspot conflicts */
        #scanner-app-container {
            max-width: 600px;
            margin: 0 auto;
            min-height: 100vh;
            background: var(--bg);
            padding-bottom: 2rem;
            position: relative;
        }

        /* Header */
        .app-header {
            background-color: var(--primary);
            color: white;
            padding: 1.5rem 1rem;
            text-align: center;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            box-shadow: 0 4px 10px rgba(139, 94, 60, 0.2);
            position: relative;
            z-index: 10;
        }

        .app-header h1 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .stats-badge {
            display: inline-block;
            background: rgba(255,255,255,0.2);
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 500;
        }

        /* Main Content */
        .content-area {
            padding: 1rem;
        }

        /* Cards */
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 1.2rem;
            margin-bottom: 1.2rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid rgba(201, 168, 124, 0.2);
        }

        /* Scanner Area */
        #reader-wrapper {
            position: relative;
            width: 100%;
            overflow: hidden;
            border-radius: 12px;
            background: #000;
            margin-bottom: 1rem;
        }

        #reader {
            width: 100%;
        }

        .controls {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        /* Buttons */
        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0.8rem 1.2rem;
            font-family: 'Poppins', sans-serif;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex: 1;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
        }

        .btn-success {
            background-color: var(--success);
            font-size: 1.1rem;
            padding: 1rem;
            width: 100%;
            font-weight: 600;
        }

        .btn-icon {
            margin-right: 8px;
        }

        /* Forms */
        .form-group {
            margin-bottom: 1rem;
        }

        .input-group {
            display: flex;
            gap: 0.5rem;
        }

        .input-control {
            flex: 1;
            padding: 0.8rem 1rem;
            border: 1px solid #E0E0E0;
            border-radius: 8px;
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            color: var(--text-main);
            outline: none;
        }

        .input-control:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(201, 168, 124, 0.2);
        }

        select.input-control {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%238B5E3C%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 1rem top 50%;
            background-size: 0.65rem auto;
            padding-right: 2.5rem;
        }

        /* Result Section Overlays */
        #result-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 100;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .result-card {
            background: white;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            padding: 2rem 1.5rem;
            text-align: center;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .result-icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
            font-size: 2.5rem;
            color: white;
        }

        .icon-success { background: var(--success); }
        .icon-warning { background: var(--warning); }
        .icon-error { background: var(--error); }

        .guest-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        .guest-details {
            background: var(--light-gray);
            border-radius: 12px;
            padding: 1rem;
            margin: 1rem 0;
            text-align: left;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
        }
        .detail-row:last-child { margin-bottom: 0; }
        .detail-label { color: var(--gray); font-weight: 500; }
        .detail-value { font-weight: 600; color: var(--text-main); }

        .status-msg {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
        }

        .msg-success { color: var(--success); }
        .msg-warning { color: var(--warning); }
        .msg-error { color: var(--error); }

        /* Loader */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(253, 248, 244, 0.8);
            z-index: 200;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(201, 168, 124, 0.3);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 1s ease-in-out infinite;
            margin-bottom: 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* History */
        .history-list {
            list-style: none;
            margin-top: 1rem;
        }

        .history-item {
            padding: 0.8rem;
            border-bottom: 1px solid #EEE;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .history-item:last-child { border-bottom: none; }
        
        .history-info h4 {
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            margin-bottom: 0.2rem;
        }
        .history-info p {
            font-size: 0.8rem;
            color: var(--gray);
        }
        .history-status {
            font-size: 0.8rem;
            padding: 0.3rem 0.6rem;
            border-radius: 12px;
            font-weight: 500;
        }
        .status-hadir { background: #E8F5E9; color: var(--success); }

        .section-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            font-size: 1.2rem;
        }

        .text-sm {
            font-size: 0.85rem;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<div id="scanner-app-container">
    
    <!-- Loader -->
    <div id="loader">
        <div class="spinner"></div>
        <div style="font-weight: 500; color: var(--primary);">Memproses...</div>
    </div>

    <!-- Header -->
    <header class="app-header">
        <h1 id="wedding-title">Buku Tamu QR</h1>
        <div class="stats-badge" id="attendance-counter">
            Hadir: - / - Tamu
        </div>
    </header>

    <div class="content-area">
        <!-- Scanner Card -->
        <div class="card">
            <h2 style="font-size: 1.2rem; margin-bottom: 1rem; text-align: center;">Scan QR Code</h2>
            
            <div class="form-group">
                <select id="camera-select" class="input-control w-100" style="width: 100%;">
                    <option value="">Pilih Kamera...</option>
                </select>
            </div>

            <div id="reader-wrapper">
                <div id="reader"></div>
            </div>

            <div class="controls">
                <button id="btn-start-scan" class="btn">Mulai Kamera</button>
                <button id="btn-stop-scan" class="btn btn-outline hidden">Stop Kamera</button>
            </div>
            <div id="scan-status" style="text-align: center; font-size: 0.85rem; color: var(--gray);">Kamera siap digunakan.</div>
        </div>

        <!-- Manual Input Card -->
        <div class="card">
            <h2 style="font-size: 1.1rem; margin-bottom: 0.8rem;">Input Manual</h2>
            <div class="form-group">
                <label style="font-size: 0.85rem; color: var(--gray); display: block; margin-bottom: 0.3rem;">Cari via Kode QR</label>
                <div class="input-group">
                    <input type="text" id="manual-qr" class="input-control" placeholder="Contoh: WD-12345">
                    <button id="btn-manual-qr" class="btn" style="flex: 0 0 auto;">Cari</button>
                </div>
            </div>
        </div>

        <!-- History Card -->
        <div class="card">
            <div class="section-title">
                <h2>Riwayat Scan</h2>
                <button id="btn-clear-history" class="btn btn-outline" style="padding: 0.3rem 0.8rem; font-size: 0.8rem; flex: none;">Bersihkan</button>
            </div>
            <ul id="history-list" class="history-list">
                <!-- History items will be populated here -->
                <li style="text-align: center; color: var(--gray); font-size: 0.9rem; padding: 1rem;">Belum ada riwayat scan.</li>
            </ul>
        </div>
    </div>

    <!-- Result Overlay -->
    <div id="result-overlay">
        <div class="result-card">
            <div id="result-icon" class="result-icon icon-success">✓</div>
            
            <!-- Context for Not Found -->
            <div id="result-error" class="hidden">
                <div class="status-msg msg-error" id="error-message">QR Code tidak ditemukan!</div>
                <button class="btn btn-outline w-100" style="width: 100%; margin-top: 1rem;" onclick="closeResult()">Tutup & Scan Lagi</button>
            </div>

            <!-- Context for Found Guest -->
            <div id="result-found" class="hidden">
                <div class="guest-name" id="res-name">Nama Tamu</div>
                <div class="status-msg" id="res-status-msg">Silakan konfirmasi kehadiran.</div>
                
                <div class="guest-details">
                    <div class="detail-row">
                        <span class="detail-label">Kode QR</span>
                        <span class="detail-value" id="res-qr">WD-XXXXX</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Jumlah Undangan</span>
                        <span class="detail-value" id="res-pax">2 Orang</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Status</span>
                        <span class="detail-value" id="res-status">Belum Hadir</span>
                    </div>
                    <div class="detail-row hidden" id="res-time-row">
                        <span class="detail-label">Waktu Hadir</span>
                        <span class="detail-value" id="res-time">-</span>
                    </div>
                </div>

                <!-- Action button -->
                <button id="btn-confirm" class="btn btn-success hidden">KONFIRMASI KEHADIRAN</button>
                <button id="btn-close-result" class="btn btn-outline w-100" style="width: 100%; margin-top: 1rem;" onclick="closeResult()">Tutup & Scan Lagi</button>
            </div>
        </div>
    </div>

</div>

<script>
    /**
     * CONFIGURATION
     */
    const API_URL = 'https://script.google.com/macros/s/AKfycbzOaN2lNR_Qi6KXYpH-8O0TgER9iU0rWzClSFkh1LLmfrp535mI8ONPJWQ5yvxKxqXu/exec'; // Ganti dengan URL web app Apps Script
    const WEDDING_TITLE = 'Pernikahan Rezi & Adel';
    
    // UI Elements
    document.getElementById('wedding-title').textContent = WEDDING_TITLE;
    
    // Audio Context for beeps
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = new AudioContext();

    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        
        if (type === 'success') {
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(880, audioCtx.currentTime); // A5
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            oscillator.start(audioCtx.currentTime);
            oscillator.stop(audioCtx.currentTime + 0.3);
        } else if (type === 'error') {
            oscillator.type = 'sawtooth';
            oscillator.frequency.setValueAtTime(150, audioCtx.currentTime);
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            oscillator.start(audioCtx.currentTime);
            oscillator.stop(audioCtx.currentTime + 0.3);
        }
    }

    function vibrate(pattern) {
        if (navigator.vibrate) {
            navigator.vibrate(pattern);
        }
    }

    // State
    let html5QrCode;
    let currentGuestQr = '';
    let autoDismissTimer;

    // Initialize Scanner
    async function initScanner() {
        html5QrCode = new Html5Qrcode("reader");
        
        try {
            const devices = await Html5Qrcode.getCameras();
            if (devices && devices.length) {
                const select = document.getElementById('camera-select');
                select.innerHTML = '';
                devices.forEach(device => {
                    const option = document.createElement('option');
                    option.value = device.id;
                    option.text = device.label || `Camera ${select.length + 1}`;
                    select.appendChild(option);
                });
                // Prefer back camera if available
                const backCamera = devices.find(d => d.label.toLowerCase().includes('back') || d.label.toLowerCase().includes('belakang'));
                if (backCamera) select.value = backCamera.id;
            }
        } catch (err) {
            console.error("Camera access error:", err);
            document.getElementById('scan-status').textContent = 'Tidak dapat mengakses kamera. Gunakan input manual.';
        }
    }

    document.getElementById('btn-start-scan').addEventListener('click', startScanner);
    document.getElementById('btn-stop-scan').addEventListener('click', stopScanner);

    function startScanner() {
        if (!html5QrCode) return;
        
        const cameraId = document.getElementById('camera-select').value;
        const config = { fps: 10, qrbox: { width: 250, height: 250 } };
        
        let cameraConfig = cameraId ? cameraId : { facingMode: "environment" };

        html5QrCode.start(cameraConfig, config, onScanSuccess, onScanFailure)
            .then(() => {
                document.getElementById('btn-start-scan').classList.add('hidden');
                document.getElementById('btn-stop-scan').classList.remove('hidden');
                document.getElementById('scan-status').textContent = 'Memindai... Arahkan ke QR Code';
            })
            .catch(err => {
                console.error(err);
                alert('Gagal memulai kamera: ' + err);
            });
    }

    function stopScanner() {
        if (html5QrCode && html5QrCode.isScanning) {
            html5QrCode.stop().then(() => {
                document.getElementById('btn-start-scan').classList.remove('hidden');
                document.getElementById('btn-stop-scan').classList.add('hidden');
                document.getElementById('scan-status').textContent = 'Kamera dihentikan.';
            });
        }
    }

    function extractQR(scannedText) {
        // If it's a URL, try to extract 'qr' parameter
        try {
            if (scannedText.startsWith('http')) {
                const url = new URL(scannedText);
                const qrParam = url.searchParams.get('qr');
                if (qrParam) return qrParam;
            }
        } catch (e) {}
        // Fallback: use raw text, trim it
        return scannedText.trim();
    }

    function onScanSuccess(decodedText, decodedResult) {
        // Pause scanning to process
        if (html5QrCode.isScanning) html5QrCode.pause();
        vibrate(50);
        
        const qrCode = extractQR(decodedText);
        processQRCode(qrCode);
    }

    function onScanFailure(error) {
        // Ignore continuous scan failures
    }

    // Manual Entry
    document.getElementById('btn-manual-qr').addEventListener('click', () => {
        const qr = document.getElementById('manual-qr').value.trim();
        if (qr) processQRCode(qr);
    });

    // API & Processing
    function showLoader() { document.getElementById('loader').style.display = 'flex'; }
    function hideLoader() { document.getElementById('loader').style.display = 'none'; }

    async function processQRCode(qrCode) {
        currentGuestQr = qrCode;
        showLoader();
        
        try {
            // First check status
            const response = await fetch(`${API_URL}?action=checkIn&qr=${encodeURIComponent(qrCode)}`, {
                method: 'GET',
                mode: 'cors'
            });
            const data = await response.json();
            
            hideLoader();
            showResultCard(data);

        } catch (err) {
            hideLoader();
            console.error('API Error:', err);
            alert('Terjadi kesalahan jaringan. Coba lagi.');
            if (html5QrCode && html5QrCode.isScanning) html5QrCode.resume();
        }
    }

    function showResultCard(data) {
        const overlay = document.getElementById('result-overlay');
        const icon = document.getElementById('result-icon');
        const resFound = document.getElementById('result-found');
        const resError = document.getElementById('result-error');
        
        // Reset
        overlay.style.display = 'flex';
        resFound.classList.add('hidden');
        resError.classList.add('hidden');
        document.getElementById('btn-confirm').classList.add('hidden');
        document.getElementById('res-time-row').classList.add('hidden');
        
        clearTimeout(autoDismissTimer);

        if (data.status === 'success' || data.success === true) {
            // Found
            const g = data.data || {};
            const guestName = g.nama || g.name || '-';
            const guestQr = g.qr || g.qrCode || '-';
            const guestPax = g.jumlah || g.pax || 1;
            const guestTime = g.waktuHadir || g.checkInTime || g.timestamp || '-';
            const isAlreadyCheckedIn = (data.message && data.message.toLowerCase().includes('sudah')) || (g.status && g.status.toLowerCase() === 'hadir');

            resFound.classList.remove('hidden');
            document.getElementById('res-name').textContent = guestName;
            document.getElementById('res-qr').textContent = guestQr;
            document.getElementById('res-pax').textContent = `${guestPax} Orang`;
            
            // Check if already checked in
            if (isAlreadyCheckedIn) {
                // Already checked in
                icon.className = 'result-icon icon-warning';
                icon.textContent = '!';
                playSound('error');
                vibrate([100, 50, 100]);
                
                document.getElementById('res-status-msg').textContent = 'Tamu Sudah Hadir!';
                document.getElementById('res-status-msg').className = 'status-msg msg-warning';
                document.getElementById('res-status').textContent = 'Hadir';
                document.getElementById('res-time-row').classList.remove('hidden');
                document.getElementById('res-time').textContent = guestTime;
                
                autoDismissTimer = setTimeout(closeResult, 5000);
            } else {
                icon.className = 'result-icon icon-success';
                icon.textContent = '✓';
                playSound('success');
                vibrate([200]);

                document.getElementById('res-status-msg').textContent = 'Berhasil Check-in!';
                document.getElementById('res-status-msg').className = 'status-msg msg-success';
                document.getElementById('res-status').textContent = 'Hadir';
                
                // Add to history
                addToHistory(guestName, new Date().toLocaleTimeString('id-ID'), guestQr);
                refreshStats();
                
                autoDismissTimer = setTimeout(closeResult, 4000);
            }
        } else {
            // Error / Not Found
            resError.classList.remove('hidden');
            icon.className = 'result-icon icon-error';
            icon.textContent = '✗';
            document.getElementById('error-message').textContent = data.message || 'QR Code tidak ditemukan!';
            playSound('error');
            vibrate([100, 50, 100]);
            
            autoDismissTimer = setTimeout(closeResult, 4000);
        }
    }

    function closeResult() {
        document.getElementById('result-overlay').style.display = 'none';
        clearTimeout(autoDismissTimer);
        document.getElementById('manual-qr').value = '';
        if (html5QrCode && html5QrCode.isScanning) {
            html5QrCode.resume();
        }
    }

    // Stats & History
    async function refreshStats() {
        try {
            const res = await fetch(`${API_URL}?action=getStats`);
            const data = await res.json();
            if (data.status === 'success' || data.success === true) {
                const s = data.data || {};
                const attended = s.attended !== undefined ? s.attended : (s.hadir || 0);
                const total = s.total !== undefined ? s.total : 0;
                document.getElementById('attendance-counter').textContent = `Hadir: ${attended} / ${total} Undangan`;
            }
        } catch (e) {
            console.error('Stats error:', e);
        }
    }

    function loadHistory() {
        const history = JSON.parse(localStorage.getItem('guestHistory') || '[]');
        const list = document.getElementById('history-list');
        list.innerHTML = '';
        
        if (history.length === 0) {
            list.innerHTML = '<li style="text-align: center; color: var(--gray); font-size: 0.9rem; padding: 1rem;">Belum ada riwayat scan.</li>';
            return;
        }

        history.forEach(item => {
            const li = document.createElement('li');
            li.className = 'history-item';
            li.innerHTML = `
                <div class="history-info">
                    <h4>${item.name}</h4>
                    <p>${item.qr} • ${item.time}</p>
                </div>
                <div class="history-status status-hadir">Hadir</div>
            `;
            list.appendChild(li);
        });
    }

    function addToHistory(name, time, qr) {
        let history = JSON.parse(localStorage.getItem('guestHistory') || '[]');
        history.unshift({ name, time, qr });
        if (history.length > 20) history.pop();
        localStorage.setItem('guestHistory', JSON.stringify(history));
        loadHistory();
    }

    document.getElementById('btn-clear-history').addEventListener('click', () => {
        if(confirm('Hapus semua riwayat di perangkat ini?')) {
            localStorage.removeItem('guestHistory');
            loadHistory();
        }
    });

    // Boot
    window.onload = () => {
        initScanner();
        loadHistory();
        if(API_URL !== 'YOUR_APPS_SCRIPT_URL_HERE') {
            refreshStats();
            setInterval(refreshStats, 15000); // Auto refresh stats
        }
    };

</script>
</body>
</html>
